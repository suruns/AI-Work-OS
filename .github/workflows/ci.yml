name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run API and unit tests
        env:
          AI_WORK_OS_DB: sqlite:///./test-ai-work-os.db
          AI_WORK_OS_STORAGE: ./test-storage
        run: pytest -q -m "not e2e"
      - name: Run Dashboard E2E tests three times
        env:
          AI_WORK_OS_E2E_ARTIFACTS: artifacts/e2e
        run: |
          for attempt in 1 2 3; do
            echo "Dashboard E2E stability run $attempt/3"
            pytest -q tests/e2e -m e2e
          done
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-e2e-failures
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
