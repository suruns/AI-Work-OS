name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          AI_WORK_OS_DB: sqlite:///./test-ai-work-os.db
          AI_WORK_OS_STORAGE: ./test-storage
        run: pytest -q
