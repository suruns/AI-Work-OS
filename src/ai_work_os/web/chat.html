<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Work OS · 对话</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#25324c;--muted:#9aa9c4;--text:#edf3ff;--accent:#8ab4ff;--green:#55d6a2;--red:#ff7f91;--yellow:#ffd479}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#1b2a4c 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #3b5279;background:#243858;color:white;border-radius:9px;padding:9px 13px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent);text-decoration:none}.shell{height:100vh;min-height:560px;max-width:1600px;margin:auto;padding:18px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.sidebar,.main{background:linear-gradient(145deg,#141e33,#10182a);border:1px solid var(--line);border-radius:15px;min-width:0}.sidebar{display:flex;flex-direction:column;padding:16px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8ab4ff,#9b8cff);display:grid;place-items:center;color:#0b1020;font-weight:900;font-size:18px}.brand h1{font-size:18px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.field{display:grid;gap:6px;margin-bottom:12px}label{font-size:12px;color:#bac8e0}input,textarea,select{width:100%;background:#0b1324;border:1px solid #2a3955;color:var(--text);border-radius:9px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.primary{background:#9dbdff;color:#081224;border-color:#9dbdff;font-weight:700}.new{width:100%;margin:8px 0 14px}.conversation-list{display:grid;gap:7px;overflow:auto;min-height:0}.conversation{width:100%;text-align:left;background:#0e1729;border:1px solid var(--line);padding:10px}.conversation.active{border-color:var(--accent);background:#172642}.conversation-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation-meta{font-size:11px;color:var(--muted);margin-top:4px}.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}.main{display:flex;flex-direction:column;overflow:hidden}.topbar{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h2{font-size:16px;margin:0}.status{font-size:12px;color:var(--muted)}.status.running{color:var(--yellow)}.status.succeeded{color:var(--green)}.status.failed,.status.cancelled{color:var(--red)}.conversation-body{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;flex:1}.transcript{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:15px}.welcome{margin:auto;max-width:560px;text-align:center;padding:32px}.welcome h2{font-size:25px;margin:0 0 10px}.message{max-width:min(850px,88%);border:1px solid var(--line);border-radius:14px;padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#1b2d4a;border-color:#38537d}.message.assistant{align-self:flex-start;background:#0e1729}.message-role{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}.message-content{line-height:1.65}.message-time{font-size:11px;color:var(--muted);margin-top:8px}.turn-chip{display:inline-block;font-size:11px;border-radius:20px;padding:2px 8px;margin-left:6px;background:#293750;color:#bcd0f4}.composer{border-top:1px solid var(--line);padding:14px 18px 16px}.composer textarea{min-height:72px;max-height:220px;resize:vertical}.composer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.events{border-top:1px solid var(--line);padding:10px 18px;max-height:190px;overflow:auto;background:#0c1424}.events-head{display:flex;justify-content:space-between;align-items:center}.event-list{display:grid;gap:6px;margin-top:8px}.event{border:1px solid #263752;border-radius:8px;padding:8px 10px;background:#101b2e}.event summary{cursor:pointer;color:#c2d4f4;font-size:12px}.event pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow:auto;font:11px/1.45 ui-monospace,monospace;color:#aebdd4;margin:7px 0 0}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.error{color:var(--red);font-size:12px;min-height:18px}.actions{display:flex;align-items:center;gap:8px}.cancel{background:#492632;border-color:#784052}.dashboard-link{display:inline-block;margin-top:10px}@media(max-width:760px){.shell{height:auto;min-height:100vh;grid-template-columns:1fr;padding:9px}.sidebar{max-height:250px}.conversation-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:130px}.main{min-height:70vh}.transcript{padding:14px}.message{max-width:96%}.topbar{padding:12px}.events{max-height:160px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><div class="logo">W</div><div><h1>AI Work OS</h1><div class="muted small">Master Agent 工作区</div></div></div>
 <div class="field"><label for="project-context">项目上下文</label><select id="project-context"><option value="">不绑定项目 · 普通对话</option></select></div>
 <button id="new-conversation" class="primary new">＋ 新建对话</button>
 <div class="muted small" style="margin:0 0 8px">对话列表</div>
 <div id="conversation-list" class="conversation-list"><div class="empty">正在加载对话…</div></div>
 <div class="sidebar-foot"><div class="muted small">Master Agent 仅在当前所选项目范围内工作。创建任务或工作流只会加入队列，不代表 Worker 已开始执行。</div><a class="dashboard-link" href="/dashboard">打开任务控制台 →</a></div>
</aside>
<main class="main">
 <header class="topbar"><div><h2 id="conversation-title">新对话</h2><div id="conversation-subtitle" class="muted small">开始与 Master Agent 对话</div></div><div class="actions"><span id="connection" class="status">正在连接…</span><button id="cancel-turn" class="cancel" hidden>取消本轮</button></div></header>
 <section class="conversation-body">
  <div id="transcript" class="transcript"><div class="welcome"><h2>这次我们要处理什么？</h2><p class="muted">描述目标、询问问题，或让 Master Agent 帮你规划项目工作。</p></div></div>
  <form id="composer" class="composer"><div class="error" id="error"></div><textarea id="message-input" maxlength="100000" placeholder="向 Master Agent 发送消息…（Enter 发送，Shift+Enter 换行）" required></textarea><div class="composer-row"><span class="muted small">工作区工具为只读 · 项目 MCP 严格绑定当前项目</span><button id="send" class="primary" type="submit">发送 ↗</button></div></form>
 </section>
 <section class="events"><div class="events-head"><strong class="small">Agent 活动</strong><span id="event-count" class="muted small">暂无事件</span></div><div id="event-list" class="event-list"><div class="muted small">发送消息后，执行事件会显示在这里。</div></div></section>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=value=>{if(!value)return "";const s=typeof value==="string"&&!/(?:Z|[+-]\d{2}:?\d{2})$/i.test(value)?value.replace(" ","T")+"Z":value;return new Date(s).toLocaleString()};
async function api(url,options={}){const response=await fetch(url,{headers:{"Content-Type":"application/json"},...options});const data=await response.json().catch(()=>({detail:response.statusText}));if(!response.ok)throw new Error(data.detail||"请求失败");return data}
let projects=[],conversations=[],activeConversationId=null,activeConversation=null,turns=[],messages=[],eventRows=[],eventCursors=new Map(),loadedConversationId=null,hasOlderMessages=false,loadingOlderMessages=false,pollBusy=false,lastError="";
function setError(message){$("error").textContent=message||""}
function statusZh(value){return ({queued:"排队中",running:"执行中",succeeded:"已成功",failed:"失败",cancelled:"已取消",blocked:"已阻塞",pending:"待审批",approved:"已批准",rejected:"已拒绝",revoked:"已撤销",expired:"已过期"})[value]||value}
function roleZh(value){return value==="user"?"你":value==="assistant"?"Master Agent":value}
function eventZh(value){return ({"turn.queued":"对话已排队","turn.started":"Agent 开始处理","turn.finished":"Agent 处理完成","turn.failed":"Agent 处理失败","turn.cancel_requested":"已请求取消","turn.cancelled":"本轮已取消","execution.approval_requested":"写入执行待审批"})[value]||value}

function currentProject(){return $("project-context").value||null}
function renderProjects(){const selected=$("project-context").value;$("project-context").innerHTML='<option value="">不绑定项目 · 普通对话</option>'+projects.filter(p=>p.status==="active").map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' · '+esc(p.slug)+'</option>').join("");if(projects.some(p=>p.id===selected))$("project-context").value=selected}
function renderConversations(){const items=conversations.filter(c=>c.project_id===currentProject());$("conversation-list").innerHTML=items.length?items.map(c=>'<button class="conversation '+(activeConversationId===c.id?'active':'')+'" data-conversation-id="'+esc(c.id)+'"><div class="conversation-title">'+esc(c.title&&c.title!=="New conversation"?c.title:"新对话")+'</div><div class="conversation-meta">'+esc(c.message_count)+' messages · '+esc(c.pending_turn_count)+' active · '+esc(when(c.updated_at))+'</div></button>').join(""):'<div class="empty">当前项目还没有对话。</div>';document.querySelectorAll("[data-conversation-id]").forEach(button=>button.addEventListener("click",()=>openConversation(button.dataset.conversationId)))}
function renderTranscript(scrollBottom=true){if(!messages.length){$("transcript").innerHTML='<div class="welcome"><h2>这次我们要处理什么？</h2><p class="muted">描述目标、询问问题，或让 Master Agent 帮你规划项目工作。</p></div>';return}const older=hasOlderMessages?'<button id="load-older-messages" type="button">加载更早消息</button>':"";const turnByMessage=new Map(turns.map(t=>[t.user_message_id,t]));$("transcript").innerHTML=older+messages.map(m=>{const turn=turnByMessage.get(m.id);const chip=turn?'<span class="turn-chip">'+esc(statusZh(turn.status))+'</span>':"";return '<article class="message '+(m.role==="user"?"user":"assistant")+'"><div class="message-role">'+esc(roleZh(m.role))+chip+'</div><div class="message-content">'+esc(m.content)+'</div><div class="message-time">'+esc(when(m.created_at))+'</div></article>'}).join("");if(scrollBottom)$("transcript").scrollTop=$("transcript").scrollHeight}
function eventLabel(event){const p=event.payload||{};const useful=["subtype","tool_name","name","status","reason","error","message"];const parts=useful.filter(k=>p[k]!==undefined&&p[k]!==null&&p[k]!=="").map(k=>k.replaceAll("_"," ")+": "+String(p[k]).slice(0,180));return parts.join(" · ")}
function renderEvents(){const rows=eventRows.slice(-100);$("event-count").textContent=rows.length+" 条事件";$("event-list").innerHTML=rows.length?rows.map(e=>'<details class="event"><summary><strong>'+esc(eventZh(e.event_type))+'</strong> · '+esc(when(e.occurred_at))+(eventLabel(e)?' · '+esc(eventLabel(e)):"")+'</summary><pre>'+esc(JSON.stringify(e.payload||{},null,2))+'</pre></details>').join(""):'<div class="muted small">尚无执行事件记录。</div>'}
function renderHeader(){if(!activeConversation){$("conversation-title").textContent="新对话";$("conversation-subtitle").textContent=currentProject()?"项目："+(projects.find(p=>p.id===currentProject())?.name||"所选项目"):"普通对话 · 未绑定项目";return}$("conversation-title").textContent=activeConversation.title||"新对话";const project=projects.find(p=>p.id===activeConversation.project_id);$("conversation-subtitle").textContent=(project?"项目："+project.name:"普通对话")+" · "+activeConversation.status}
function renderTurnControls(){const pending=turns.filter(t=>["queued","running"].includes(t.status));const latest=pending[pending.length-1];$("cancel-turn").hidden=!latest;$("cancel-turn").dataset.turnId=latest?.id||"";const running=turns.some(t=>t.status==="running");$("connection").textContent=running?"Master Agent 正在处理":pending.length?"本轮已排队":"API 已连接";$("connection").className="status "+(running?"running":pending.length?"running":"succeeded");$("send").disabled=!activeConversation||activeConversation.status!=="active"}
async function loadConversationData(){if(!activeConversationId)return;const id=activeConversationId;const sameConversation=loadedConversationId===id;const lastMessageId=sameConversation&&messages.length?messages[messages.length-1].id:0;const messageQuery=sameConversation?"after_id="+lastMessageId+"&limit=500":"latest=true&limit=500";const [conversation,newMessages,ts]=await Promise.all([api("/conversations/"+encodeURIComponent(id)),api("/conversations/"+encodeURIComponent(id)+"/messages?"+messageQuery),api("/conversations/"+encodeURIComponent(id)+"/turns?latest=true&limit=500")]);if(id!==activeConversationId)return;activeConversation=conversation;const selectedProject=conversation.project_id&&projects.some(p=>p.id===conversation.project_id&&p.status==="active")?conversation.project_id:"";$("project-context").value=selectedProject;renderConversations();if(!sameConversation)hasOlderMessages=newMessages.length===500;messages=sameConversation?messages.concat(newMessages):newMessages;turns=ts;const eventResults=await Promise.all(turns.map(t=>{const cursor=sameConversation?(eventCursors.get(t.id)||0):0;const query=cursor?"after_id="+cursor+"&limit=1000":"latest=true&limit=1000";return api("/agent-turns/"+encodeURIComponent(t.id)+"/events?"+query)}));if(id!==activeConversationId)return;for(let i=0;i<turns.length;i++){const rows=eventResults[i];if(rows.length)eventCursors.set(turns[i].id,rows[rows.length-1].id)}eventRows=(sameConversation?eventRows:[]).concat(...eventResults).sort((a,b)=>a.id-b.id).slice(-1000);loadedConversationId=id;renderHeader();renderTranscript();renderEvents();renderTurnControls()}
async function loadOlderMessages(){if(!activeConversationId||!messages.length||loadingOlderMessages)return;const id=activeConversationId;loadingOlderMessages=true;const previousHeight=$("transcript").scrollHeight;const previousTop=$("transcript").scrollTop;try{const rows=await api("/conversations/"+encodeURIComponent(id)+"/messages?before_id="+messages[0].id+"&limit=500");if(id!==activeConversationId)return;hasOlderMessages=rows.length===500;if(rows.length){messages=rows.concat(messages);renderTranscript(false);$("transcript").scrollTop=previousTop+($("transcript").scrollHeight-previousHeight)}else{renderTranscript(false);$("transcript").scrollTop=previousTop}}catch(e){setError(e.message)}finally{loadingOlderMessages=false}}
async function loadConversations(){conversations=await api("/conversations?status=active&limit=100");renderConversations()}
async function openConversation(id){activeConversationId=id;activeConversation=null;messages=[];turns=[];eventRows=[];eventCursors=new Map();loadedConversationId=null;hasOlderMessages=false;renderTranscript();renderEvents();try{await loadConversationData();renderConversations()}catch(e){setError(e.message)}}
async function refresh(){if(pollBusy)return;pollBusy=true;try{if(!projects.length){projects=await api("/projects?limit=200");renderProjects()}await loadConversations();if(activeConversationId){await loadConversationData()}$("connection").title="上次刷新："+new Date().toLocaleTimeString();lastError="";}catch(e){$("connection").textContent="API 不可用";$("connection").className="status failed";if(e.message!==lastError){setError(e.message);lastError=e.message}}finally{pollBusy=false}}
async function createConversation(){setError("");try{const created=await api("/conversations",{method:"POST",body:JSON.stringify({project_id:currentProject(),title:"新对话"})});activeConversationId=created.id;activeConversation=created;messages=[];turns=[];eventRows=[];eventCursors=new Map();loadedConversationId=null;hasOlderMessages=false;await loadConversations();await loadConversationData();$("message-input").focus()}catch(e){setError(e.message)}}
$("new-conversation").addEventListener("click",createConversation);
$("transcript").addEventListener("click",event=>{if(event.target.id==="load-older-messages")loadOlderMessages()});
$("project-context").addEventListener("change",async()=>{activeConversationId=null;activeConversation=null;messages=[];turns=[];eventRows=[];eventCursors=new Map();loadedConversationId=null;hasOlderMessages=false;renderHeader();renderTranscript();renderEvents();await loadConversations()});
$("composer").addEventListener("submit",async event=>{event.preventDefault();if(!activeConversationId){await createConversation();if(!activeConversationId)return}const content=$("message-input").value.trim();if(!content)return;if(activeConversation?.status!=="active"){setError("该对话已归档，不能继续发送消息。");return}const button=$("send");button.disabled=true;setError("");try{const clientMessageId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+"-"+Math.random().toString(16).slice(2));await api("/conversations/"+encodeURIComponent(activeConversationId)+"/messages",{method:"POST",body:JSON.stringify({content,client_message_id:clientMessageId})});$("message-input").value="";await refresh()}catch(e){setError(e.message)}finally{button.disabled=false;$("message-input").focus()}});
$("message-input").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();$("composer").requestSubmit()}});
$("cancel-turn").addEventListener("click",async()=>{const id=$("cancel-turn").dataset.turnId;if(!id)return;$("cancel-turn").disabled=true;try{await api("/agent-turns/"+encodeURIComponent(id)+"/cancel",{method:"POST"});await refresh()}catch(e){setError(e.message)}finally{$("cancel-turn").disabled=false}});
(async()=>{try{projects=await api("/projects?limit=200");renderProjects();await loadConversations();if(conversations.length){await openConversation(conversations[0].id)}else{renderHeader()}$("connection").textContent="API 已连接";$("connection").className="status succeeded"}catch(e){$("connection").textContent="API 不可用";$("connection").className="status failed";setError(e.message)}setInterval(refresh,1500)})();
</script>
</body>
</html>
