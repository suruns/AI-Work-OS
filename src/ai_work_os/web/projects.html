<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Work OS · 项目管理</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#25324c;--muted:#9aa9c4;--text:#edf3ff;--accent:#8ab4ff;--green:#55d6a2;--red:#ff7f91;--yellow:#ffd479}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#1b2a4c 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #3b5279;background:#243858;color:white;border-radius:9px;padding:9px 13px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent);text-decoration:none}.app{max-width:1440px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8ab4ff,#9b8cff);display:grid;place-items:center;color:#0b1020;font-weight:900;font-size:20px}.brand h1{font-size:22px;margin:0}.muted{color:var(--muted)}.panel{background:linear-gradient(145deg,#141e33,#10182a);border:1px solid var(--line);border-radius:15px;padding:18px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}.project-list{display:grid;gap:9px;margin-top:14px}.project{border:1px solid var(--line);border-radius:11px;padding:13px;background:#0e1729;text-align:left;color:inherit;width:100%}.project.active{border-color:var(--accent);background:#172642}.project-name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:#293750;color:#bcd0f4}.pill.running{background:#483a22;color:var(--yellow)}.pill.succeeded{background:#183c35;color:var(--green)}.pill.failed{background:#442832;color:var(--red)}.field{display:grid;gap:6px;margin:12px 0}label{font-size:12px;color:#bac8e0}input,textarea{width:100%;background:#0b1324;border:1px solid #2a3955;color:var(--text);border-radius:9px;padding:10px;outline:none}textarea{resize:vertical;min-height:75px}.primary{background:#9dbdff;color:#081224;border-color:#9dbdff;font-weight:700}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:#0e1729;border:1px solid var(--line);border-radius:10px;padding:12px}.stat .n{font-size:22px;font-weight:750;margin-top:3px}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin:15px 0}.tab{background:transparent;border-color:var(--line)}.tab.active{background:#243858;border-color:var(--accent)}.items{display:grid;gap:8px}.item{background:#0e1729;border:1px solid var(--line);border-radius:10px;padding:12px}.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:650;overflow-wrap:anywhere}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.error{color:var(--red);margin:10px 0;min-height:18px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modal-card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.app{padding:12px}}
</style></head><body><div class="app">
<header class="header"><div class="brand"><div class="logo">W</div><div><h1>项目管理</h1><div class="muted">管理项目、任务、工作流和 Master Agent 目标</div></div></div><div class="top-actions"><a href="/">← 返回 Master Agent</a><a href="/dashboard">任务控制台</a><button class="primary" id="create-btn">＋ 新建项目</button></div></header>
<div class="layout"><aside class="panel"><div class="item-head"><strong>项目列表</strong><span id="project-count" class="muted small"></span></div><div id="project-list" class="project-list"><div class="empty">加载项目中…</div></div></aside>
<main class="panel"><div id="detail"><div class="empty">请选择项目查看详情</div></div></main></div></div>
<div id="modal" class="modal hidden"><form id="create-form" class="modal-card"><h2>新建项目</h2><div class="field"><label>项目名称</label><input id="name" required maxlength="160" placeholder="例如：AI Work OS"></div><div class="field"><label>工作区路径（服务器上已存在的目录）</label><input id="workspace" required placeholder="/home/user/workspace"></div><div class="field"><label>项目描述</label><textarea id="description" maxlength="10000" placeholder="项目目标、背景或约束（可选）"></textarea></div><div id="form-error" class="error"></div><div class="modal-actions"><button type="button" id="close-modal">取消</button><button type="submit" class="primary">创建项目</button></div></form></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});const d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw new Error(d.detail||"请求失败（HTTP "+r.status+"）");return d}
const statusLabel={queued:"排队中",running:"执行中",succeeded:"已完成",failed:"失败",cancelled:"已取消",blocked:"阻塞",pending:"待处理",active:"活跃",archived:"已归档",planning:"规划中",ready:"等待执行",waiting_approval:"等待审批",waiting_input:"等待输入",verifying:"验证中",cancelling:"正在取消",approved:"已批准",rejected:"已拒绝",revoked:"已撤销",expired:"已过期"};
let projects=[],selected=null,tab="tasks",detailCache={};
function pill(s){return '<span class="pill '+esc(s)+'">'+esc(statusLabel[s]||s||"未知")+'</span>'}
function counts(c={}){let t=c.tasks||{},w=c.workflows||{};return '<div class="counts">'+Object.entries(t).map(([s,n])=>'<span class="pill '+esc(s)+'">'+esc(statusLabel[s]||s)+' '+n+'</span>').join("")+'<span class="pill">工作流 '+Object.values(w).reduce((a,b)=>a+b,0)+'</span></div>'}
function renderList(){ $("project-count").textContent=projects.length+" 个";$("project-list").innerHTML=projects.length?projects.map(p=>'<button class="project '+(selected===p.id?'active':'')+'" data-id="'+esc(p.id)+'"><div class="project-name">'+esc(p.name)+'</div><div class="meta">'+esc(p.workspace_path)+'</div>'+counts(p.counts)+'</button>').join(""):'<div class="empty">暂无项目，点击“新建项目”创建。</div>';document.querySelectorAll(".project").forEach(b=>b.onclick=()=>select(b.dataset.id))}
async function loadProjects(){projects=await api("/projects");if(!selected&&projects.length)selected=projects[0].id;renderList();if(selected)await loadDetail(selected)}
async function select(id){selected=id;tab="tasks";renderList();await loadDetail(id)}
async function loadDetail(id){try{let p=await api("/projects/"+id);$("detail").innerHTML='<div class="item-head"><div><h2 style="margin:0">'+esc(p.name)+'</h2><div class="meta">'+esc(p.workspace_path)+'</div><p class="muted">'+esc(p.description||"暂无项目描述")+'</p></div><div class="top-actions">'+(p.status==="active"?'<a href="/?project_id='+encodeURIComponent(p.id)+'" class="primary" style="padding:9px 13px;border-radius:9px">在此项目中与 Master Agent 对话</a>':'')+'<button id="toggle-archive">'+(p.status==="archived"?"恢复项目":"归档项目")+'</button></div></div><div class="stats"><div class="stat"><div class="muted">任务总数</div><div class="n">'+sum(p.counts?.tasks)+'</div></div><div class="stat"><div class="muted">已完成</div><div class="n">'+(p.counts?.tasks?.succeeded||0)+'</div></div><div class="stat"><div class="muted">执行中</div><div class="n">'+(p.counts?.tasks?.running||0)+'</div></div><div class="stat"><div class="muted">待审批 / 阻塞</div><div class="n">'+((p.counts?.tasks?.pending_approval||0)+(p.counts?.tasks?.blocked||0))+'</div></div></div><div class="tabs"><button class="tab '+(tab==="tasks"?"active":"")+'" data-tab="tasks">任务</button><button class="tab '+(tab==="workflows"?"active":"")+'" data-tab="workflows">工作流</button><button class="tab '+(tab==="master-runs"?"active":"")+'" data-tab="master-runs">Master Agent 目标</button><button class="tab '+(tab==="conversations"?"active":"")+'" data-tab="conversations">对话</button></div><div id="tab-content" class="items">加载中…</div>';document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;loadDetail(id)});$("toggle-archive").onclick=async()=>{try{await api("/projects/"+id,{method:"PATCH",body:JSON.stringify({status:p.status==="archived"?"active":"archived"})});projects=await api("/projects");renderList();await loadDetail(id)}catch(e){alert(e.message)}};await loadTab(id)}catch(e){$("detail").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function sum(o){return Object.values(o||{}).reduce((a,b)=>a+b,0)}
async function loadTab(id){const target=$("tab-content");try{let data=await api("/projects/"+id+"/"+tab);if(!data.length){target.innerHTML='<div class="empty">此项目暂无'+({tasks:"任务",workflows:"工作流","master-runs":"Master Agent 目标",conversations:"对话"}[tab])+'</div>';return}target.innerHTML=data.map(x=>{let title=x.title||x.name||x.goal||x.id,status=tab==="master-runs"?(x.derived_status||x.status):(x.status||"unknown"),meta=x.created_at||x.updated_at||x.workspace_path||"";let details=[];if(tab==="master-runs"){details.push("已验证任务 "+(x.completed_task_count||0)+"/"+(x.required_task_count||0));details.push("关联任务 "+(x.task_count||0));details.push("步骤 "+(x.step_count||0)+"/"+(x.max_steps||0))}else if(tab==="tasks"&&x.verification_status)details.push("验证："+(statusLabel[x.verification_status]||x.verification_status));else if(tab==="conversations"){details.push((x.message_count||0)+" 条消息");if(x.pending_turn_count)details.push(x.pending_turn_count+" 个进行中")}else if(tab==="workflows"&&x.counts)details.push("任务 "+sum(x.counts));return '<article class="item"><div class="item-head"><div class="title">'+esc(title)+'</div>'+pill(status)+'</div><div class="meta">'+esc([meta,...details].filter(Boolean).join(" · "))+'</div>'+(x.error_summary?'<div class="meta" style="color:var(--red)">'+esc(x.error_summary)+'</div>':'')+(x.counts?counts({tasks:x.counts}):'')+'</article>'}).join("")}catch(e){target.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$("create-btn").onclick=()=>{$("modal").classList.remove("hidden");$("form-error").textContent=""};$("close-modal").onclick=()=> $("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};
$("create-form").onsubmit=async e=>{e.preventDefault();$("form-error").textContent="";try{let p=await api("/projects",{method:"POST",body:JSON.stringify({name:$("name").value,workspace_path:$("workspace").value,description:$("description").value||null})});projects.unshift(p);selected=p.id;$("modal").classList.add("hidden");$("create-form").reset();renderList();await loadDetail(p.id)}catch(err){$("form-error").textContent=err.message}};
loadProjects().catch(e=>$("project-list").innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script></body></html>
